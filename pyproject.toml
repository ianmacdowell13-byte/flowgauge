[project]
name = "flowgauge"
version = "0.1.0"
description = "Opinionated GA4 analytics MCP server + skill — decisions, not tables."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "FlowGauge contributors" }]
keywords = ["mcp", "google-analytics", "ga4", "analytics", "llm", "claude"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "mcp>=1.2.0",
    "google-analytics-data>=0.18.0",
    "google-analytics-admin>=0.22.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.20"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
flowgauge = "flowgauge.server:main"

[project.urls]
Homepage = "https://github.com/ianmacdowell13-byte/flowgauge"
Issues = "https://github.com/ianmacdowell13-byte/flowgauge/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowgauge"]

[tool.ruff]
line-length = 100
target-version = "py310"
